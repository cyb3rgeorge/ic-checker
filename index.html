<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Malaysian IC Checker</title>
        <link rel="stylesheet" href="style.css" />
        <script src="index.js" defer></script>
    </head>

    <body>
        <toggle>
            <button onclick="darkMode()" style="position: fixed; top: 10px; right: 10px;">Toggle Light/Dark Mode</button>
            <script>
                function darkMode() {
                    var element = document.body;
                    element.classList.toggle("darkMode");
                }
            </script>
        </toggle>
        
        <h1>Open-Source Malaysian IC Checker</h1>
        <p></p>
        <p>Demo IC Number: 080229-07-1234</p>

        <form id="icForm">
            <label for="icInput">IC Number:</label>

            <input
                type="text"
                id="icInput"
                placeholder="Enter IC number"
                required
            >

            <button type="submit">Check IC</button>
        </form>

        <pre id="result"></pre>

        <p><a href="https://github.com/cyb3rgeorge/ic-checker" target="_blank">GitHub</a></p>
    </body>
</html>
